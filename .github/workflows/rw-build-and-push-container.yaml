---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: RW - Build and Push Container

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      app_version:
        required: true
        type: string
      containerfile_path:
        required: true
        type: string

jobs:
  build:
    name: Build and Push Container
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ inputs.app_name }}
          flavor: latest=false
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}/${{ inputs.containerfile_path }}
            org.opencontainers.image.title=${{ inputs.app_name }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.app_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.app_version }}
            type=semver,pattern={{major}},value=${{ inputs.app_version }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          file: ${{ inputs.containerfile_path }}
          push: true
          annotations: ${{ steps.meta.outputs.annotations }}
          tags: ${{ steps.meta.outputs.tags }}

      - name: Attestation
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          push-to-registry: true
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.app_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
